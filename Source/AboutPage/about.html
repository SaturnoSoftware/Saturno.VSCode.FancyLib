<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}}; img-src {{cspSource}} data:; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
  />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>About {{extensionName}}</title>
</head>
<body>
  <main><div class="col">
    <section class="card header-card">
      <img class="header-card-icon" src="{{headerIconUri}}" alt="{{headerIconAlt}}">
      <h1>{{headerName}}</h1>
      <p class="header-card-desc">{{headerDescription}}</p>
      <span class="header-card-ver">Version {{headerVersion}} - Build {{headerBuild}}</span>
      <span class="header-card-legal">{{headerLegal}}</span>
    </section>
    <section class="card app-card app-card-publisher">
      <img class="app-card-logo" src="{{publisherIconUri}}" alt="{{publisherIconAlt}}">
      <div class="app-card-text">
        <span class="app-card-name">{{publisherName}}</span>
        <span class="app-card-desc muted">{{publisherDescription}}</span>
      </div>
      <div class="app-card-links">{{publisherLinksHtml}}</div>
    </section>
    <h2>More Software</h2>
    <div class="grid">{{moreSoftwareHtml}}</div>
    <button class="changelog-button" type="button" data-command="openChangelog">{{changelogButtonLabel}}</button>
  </div></main>
  <script nonce="{{nonce}}">
    (function () {
      var vscode = acquireVsCodeApi();
      document.addEventListener("click", function (event) {
        var target = event.target.closest("[data-command]");
        if (!target) {
          return;
        }
        vscode.postMessage({ command: target.getAttribute("data-command") });
      });
    })();
  </script>
</body>
</html>
